# Single source of truth for every choice the pipeline makes.

data:
  competition: ieee-fraud-detection
  # Only the labelled training files are used. The Kaggle test set has no
  # released labels, so it cannot support a dollar-denominated evaluation.
  files: [train_transaction.csv, train_identity.csv]

# Split boundaries are expressed in TransactionDT day-index, never row counts,
# so they stay reproducible if the row ordering ever changes.

split:
  # TransactionDT is seconds from an UNKNOWN reference. Day index is
  # TransactionDT // 86400, which is reference-free. Span is ~183 days.
  train_days: [0, 131]      # [inclusive, exclusive)
  # 21 days rather than 31, so that training ends ten days closer to eval_days.
  calib_days: [131, 152]    # calibration of predicted probabilities
  eval_days: [152, 183]     # policy evaluation, in dollars
  # The last days of train_days are not fitted on: they only decide when to stop adding
  # trees. Stopping on calib_set would tune the model to the rows it is calibrated on.
  valid_days: 14

model:
  seeds: [1, 2, 3, 4, 5]    # one booster each; their scores are averaged
  objective: binary
  learning_rate: 0.02
  num_leaves: 64
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  num_boost_round: 10000
  early_stopping_rounds: 500

# Every value below has a row in assumptions.md; the two files change together.
economics:
  # PSP net revenue per approved legitimate dollar, net of interchange and scheme fees,
  # under each pricing model. The threshold never depends on it; only the dollars do.
  take_rates:
    interchange_plus: 0.00167   # Adyen, Q2 2025: enterprise merchants
    blended: 0.0036             # Stripe, 2025: flat-rate SMB and mid-market merchants
  # Visa VAMP ratio caps: (fraud reports + disputes) / settled card-not-present transactions.
  # The data is a pool of merchants, so the acquirer caps apply to the whole of it.
  vamp_caps:
    acquirer_above_standard: 0.005
    acquirer_excessive: 0.007
  # Caps the predicted ratio must meet as well: it is the only one a PSP sees before
  # chargebacks arrive, and above 0.7% it would be reading Excessive all month.
  predicted_ratio_caps: [acquirer_excessive]
  # Visa fee per counted event once the realised ratio is over each cap.
  vamp_fee_per_event:
    acquirer_above_standard: 4
    acquirer_excessive: 8
